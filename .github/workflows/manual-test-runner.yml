name: Test Suite Runner

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke-tests'
        type: choice
        options:
        - smoke-tests
        - regression-tests
        - all-tests
        - parallel-tests
      browser:
        description: 'Browser to use'
        required: true
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
        - edge
      headless:
        description: 'Run in headless mode'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  custom-test-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Set up Chrome Browser
      if: inputs.browser == 'chrome'
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        
    - name: Set up Firefox Browser
      if: inputs.browser == 'firefox'
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: latest
        
    - name: Set up ChromeDriver
      if: inputs.browser == 'chrome'
      uses: nanasess/setup-chromedriver@v2
      
    - name: Install dependencies
      run: mvn clean compile test-compile
      
    - name: Run Custom Test Suite
      run: |
        mvn clean test \
          -Dheadless=${{ inputs.headless }} \
          -Dbrowser=${{ inputs.browser }} \
          -DsuiteXmlFile=src/test/resources/testng-suites/${{ inputs.test_suite }}.xml
      continue-on-error: true
      
    - name: Generate Reports
      if: always()
      run: |
        mvn allure:report
        mkdir -p reports/extent-reports
        mkdir -p reports/allure-report
        if [ -d "test-output/extent-reports" ]; then
          cp -r test-output/extent-reports/* reports/extent-reports/
        fi
        if [ -d "target/site/allure-maven-plugin" ]; then
          cp -r target/site/allure-maven-plugin/* reports/allure-report/
        fi
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: custom-test-results-${{ inputs.test_suite }}-${{ inputs.browser }}-${{ github.run_number }}
        path: |
          reports/
          allure-results/
          test-output/
        retention-days: 30
        
    - name: Display Report Information
      if: always()
      run: |
        echo "🎉 Test execution completed!"
        echo "📊 Test Reports Generated:"
        echo "   • Test Suite: ${{ inputs.test_suite }}"
        echo "   • Browser: ${{ inputs.browser }}"
        echo "   • Headless: ${{ inputs.headless }}"
        echo ""
        echo "📁 Artifacts Available:"
        echo "   • Report artifacts uploaded with 30-day retention"
        echo "   • Artifact name: custom-test-results-${{ inputs.test_suite }}-${{ inputs.browser }}-${{ github.run_number }}"
        echo ""
        echo "🔗 Access Reports:"
        echo "   • Go to Actions → This workflow run → Artifacts section"
        echo "   • Download and extract the artifact to view reports locally"
        echo ""
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "ℹ️  Note: For live GitHub Pages reports, push to main branch and use the main workflow"
        fi
