# Application Configuration
app.name=Modern Selenium TestNG Framework
app.version=1.0.0
app.url=https://www.google.com

# Browser Configuration
browser=chrome
browser.headless=false
browser.maximize=true
browser.implicit.wait=10
browser.explicit.wait=30
browser.page.load.timeout=30

# Grid Configuration
grid.enabled=false
grid.hub.url=http://localhost:4444/wd/hub

# LambdaTest Configuration
lambdatest.enabled=false
lambdatest.username=${LAMBDATEST_USERNAME}
lambdatest.access.key=${LAMBDATEST_ACCESS_KEY}
lambdatest.grid.url=https://${lambdatest.username}:${lambdatest.access.key}@hub.lambdatest.com/wd/hub

# Test Execution Configuration
test.thread.count=1
test.retry.count=1
test.screenshot.on.failure=true
test.screenshot.on.pass=false

# Reporting Configuration
extent.report.path=test-output/extent-reports/extent-report.html
extent.report.title=Automation Test Report
extent.report.name=Test Execution Report
allure.results.directory=target/allure-results

# Test Data Configuration
test.data.path=src/test/resources/testdata/
test.data.format=json

# Logging Configuration
log.level=INFO
log.file.path=logs/automation.log
